name: Build APK and Play bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q StatusSaver.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build direct APK
        working-directory: StatusSaver
        run: gradle assembleDirectRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: 548-Status-direct-apk
          path: StatusSaver/app/build/outputs/apk/direct/release/app-direct-release.apk

      - name: Build Google Play bundle
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        working-directory: StatusSaver
        env:
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          gradle bundlePlayRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        with:
          name: 548-Status-play-aab
          path: StatusSaver/app/build/outputs/bundle/playRelease/app-play-release.aab 
